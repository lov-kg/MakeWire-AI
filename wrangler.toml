# Cloudflare Workers configuration for MakerWire AI.
#
# Deploy with:
#   npm run deploy
#
# That script builds the Vite app into dist/, compiles the /api functions into
# a single Worker at .worker/index.js, then runs `wrangler deploy`.
#
# Bindings and secrets live on the Worker (dashboard or Wrangler):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put OPENAI_API_KEY
#
# Supabase uses the public anon/publishable key. It is entered in the app at
# runtime (Settings → Cloud & Database) or supplied as VITE_SUPABASE_URL /
# VITE_SUPABASE_ANON_KEY at build time. Never add a service-role key here.

name = "makerwire-ai"
compatibility_date = "2026-11-01"

# Compiled from functions/api/* by `wrangler pages functions build`.
main = ".worker/index.js"
upload_source_maps = true

# Workers AI binding, exposed to functions as `env.AI`.
# The AI layer is optional: without this binding the app still produces
# deterministic wiring plans and pin-aware local sketches entirely client-side.
[ai]
binding = "AI"

[assets]
# Vite build output. Static assets are served without invoking the Worker.
directory = "./dist"
binding = "ASSETS"
# Preserve the existing SPA behaviour: unknown paths return the app shell.
not_found_handling = "single-page-application"
# /api/* always goes to the Worker, including unknown API routes, so clients
# receive JSON errors instead of the app shell.
run_worker_first = ["/api/*"]

# Non-secret configuration. Override these in the dashboard if you prefer.
[vars]
# GEMINI_MODEL = "gemini-2.5-flash"
# WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# ALLOWED_ORIGIN = "https://makerwire-ai.<your-subdomain>.workers.dev"
